; ============================================================================
; Configurações Didáticas do PHP para Desenvolvimento (Aula 09 - ADS)
; Equivalente ao painel de configuração do XAMPP, mas versionado em código
; ============================================================================

; 1. EXIBIÇÃO DE ERROS (Essencial para os alunos debugarem no navegador!)
; Em produção (servidor real), display_errors DEVE ser Off por segurança.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; 2. REGIONALIZAÇÃO E FUSO HORÁRIO
date.timezone = "America/Sao_Paulo"
default_charset = "UTF-8"

; 3. LIMITES DE RECURSOS (Adequados para laboratório e importação no phpMyAdmin)
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120

; 4. EXTENSÕES HABILITADAS (Drivers de Banco de Dados MySQL/PDO e Utilitários)
; Nota: A ordem importa! mysqlnd e pdo são a base para pdo_mysql e mysqli.
extension=mysqlnd
extension=pdo
extension=pdo_mysql
extension=mysqli
extension=sqlite3
extension=mbstring
extension=curl
extension=gd
extension=zip
extension=intl

; 5. CONFIGURAÇÃO DE SOCKET DO MYSQL/MARIADB LOCAL
; Permite conectar tanto via "127.0.0.1" (TCP) quanto via "localhost" (Socket Unix)
[Pdo_mysql]
pdo_mysql.default_socket = /run/mysqld/mysqld.sock

[MySQLi]
mysqli.default_socket = /run/mysqld/mysqld.sock
mysqli.default_port = 3306

; 6. DEPURAÇÃO PASSO A PASSO (Xdebug 3 integrado ao VS Code)
[xdebug]
zend_extension=xdebug.so
xdebug.mode=develop,debug
xdebug.start_with_request=yes
xdebug.client_port=9003
