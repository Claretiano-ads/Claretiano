<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Layout</title>
    <!-- Conectando nosso CSS -->
    <link rel="stylesheet" type="text/css" href="estilo.css" />
</head>
<body>

    <!-- O Topo do Site -->
    <header>
        <h1>Logotipo do Site</h1>
    </header>

    <!-- A Barra de Navegação (Menu) -->
    <nav>
        <ul class="menu">
            <li class="menu"><a class="menu" href="#">Início</a></li>
            <li class="menu"><a class="menu" href="#">Notícias</a></li>
            <li class="menu"><a class="menu" href="#">Contato</a></li>
        </ul>
    </nav>

    <!-- Área Principal de Conteúdo -->
    <section>
        <h2>Área de Postagens</h2>
        <article>
            <p>Este é o conteúdo do nosso primeiro artigo.</p>
        </article>
    </section>

    <!-- Barra Lateral (Ficará à direita) -->
    <aside>
        <h3>Lateral</h3>
        <p>Links úteis e propagandas ficam aqui.</p>
    </aside>

    <!-- O Rodapé do Site -->
    <footer>
        <p>Rodapé da página - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
