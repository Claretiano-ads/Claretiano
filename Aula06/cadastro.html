<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" type="text/css" href="estilo.css">
</head>
<body>
<div id="conteudo" class="mid-century">
    <h2>Cadastro de Assinante</h2>
    <form action="#" method="post">
        <p class="form-group">
            <label for="nome">Nome do Agente:</label><br>
            <input type="text" class="campo" id="nome" name="nome" placeholder="Seu nome">
        </p>
        <p class="form-group">
            <label for="email">Contato (E-mail):</label> <br>
            <input type="text" class="campo" id="email" name="email" placeholder="email@agencia.com">
        </p>
        <p class="form-group">
            <label for="plano">Nível de Acesso:</label> <br>
            <select class="campo" id="plano" name="plano">
                <option>Acesso Básico</option>
                <option>Acesso Premium (Ultra)</option>
            </select>
        </p>
        <p class="form-group">
            <input type="button" class="botao" value="Confirmar Registro">
        </p>
    </form>
</div>

<!-- ==================================================================================-->
<!-- Menu e Tabela -->
<!-- ==================================================================================-->

<ul class="menu mid-century">
    <li class="menu"><a href="#" class="menu">Base de Dados</a></li>
    <li class="menu"><a href="#" class="menu">Registrar</a></li>
    <li class="menu"><a href="#" class="menu">Níveis de Acesso</a></li>
    <li class="menu"><a href="#" class="menu">Suporte Técnico</a></li>
</ul>

<table class="mid-century">
    <thead>
        <tr>
            <th>Recurso do Traje</th>
            <th>Básico</th>
            <th>Premium (Ultra)</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Resistência Térmica</td>
            <td>Padrão</td>
            <td>Máxima</td>
        </tr>
        <tr>
            <td>Rastreamento Global</td>
            <td>Não</td>
            <td>Ativo</td>
        </tr>
        <tr>
            <td>Capas</td>
            <td>Não</td>
            <td>NADA DE CAPAS!</td>
        </tr>
    </tbody>
</table>
</body>
</html>
