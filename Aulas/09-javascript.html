<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de JavaScript</title>
    <!-- JAVASCRIPT -->
     <script type="text/javascript">
     function preencher()
     {
        var elem = document.getElementById("elemento");
        var conteudo = ("Aliquam erat volutpat. Vestibulum non lectus arcu. Vivamu s a felis in nunc fringilla tristique. Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt. Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem.");
        elem.innerHTML = conteudo;
     }
     </script>
</head>
<body>
    <!-- ------- TÍTULOS ------- -->
     <h1>Página com JavaScript</h1>
     <h2>Este é um exemplo de página Web</h2>
     <br><br><br>
    <!-- ------- JavaScript ------- -->
    <input type="button" value="preencher" onclick="preencher()" />
    <div id="elemento">

    </div>
            
</body>
</html>
